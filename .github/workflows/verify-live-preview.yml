name: Verify Live Development Preview

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/scripts/online_acceptance.py
      - .github/workflows/verify-live-preview.yml
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit expected at the live preview URL
        required: true
        default: 1ac09de449bf7a8a0953f4ca7ef037c837791c2e
        type: string

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout preview verification files
        uses: actions/checkout@v4

      - name: Resolve expected game source SHA
        id: source
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha || '1ac09de449bf7a8a0953f4ca7ef037c837791c2e' }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be a full 40-character lowercase SHA.' >&2; exit 2; }
          echo "source_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Fetch exact source helpers
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          git -C source init
          git -C source remote add origin https://github.com/zhuwd-dev/wonder-isle.git
          git -C source fetch --depth=1 origin "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Install browser acceptance tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chromium and Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"

      - name: Verify live website, game input, save restore and isolation
        env:
          SOURCE_TOOLS: ${{ github.workspace }}/source/tools
          WONDER_ISLE_PREVIEW: "1"
          PREVIEW_URL: https://zhuwd-dev.github.io/wonder-isle-preview/
          PRODUCTION_URL: https://zhuwd-dev.github.io/wonder-isle/
          EXPECTED_SHA: ${{ steps.source.outputs.source_sha }}
        run: python -u .github/scripts/online_acceptance.py
